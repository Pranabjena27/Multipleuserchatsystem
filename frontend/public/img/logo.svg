<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 50" width="210" height="50">
  <style>
    .icon-bg { fill: #0891B2; }
    .icon-line { stroke: #FFFFFF; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon-node { fill: #FFFFFF; }
    .icon-node-inner { fill: #0891B2; }
    .text-connect {
      fill: #001F3F; /* Classic Navy Blue */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .text-x {
      fill: #1E3A8A; /* Navy Blue Accent */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 28px;
      font-weight: 900;
    }
    @media (prefers-color-scheme: dark) {
      .text-connect { fill: #F8FAFC; }
      .text-x { fill: #38BDF8; }
    }
  </style>

  <!-- Modern Flat Cyan Icon Mark -->
  <g id="logo-icon" transform="translate(5, 5)">
    <!-- Base Rounded Square in Cyan -->
    <rect class="icon-bg" x="0" y="0" width="40" height="40" rx="10" />

    <!-- Connected Geometric "X" Network Grid -->
    <line class="icon-line" x1="11" y1="11" x2="29" y2="29" />
    <line class="icon-line" x1="29" y1="11" x2="11" y2="29" />

    <!-- Corner Satellite Nodes in Crisp White -->
    <circle class="icon-node" cx="11" cy="11" r="3.2" />
    <circle class="icon-node" cx="29" cy="11" r="3.2" />
    <circle class="icon-node" cx="11" cy="29" r="3.2" />
    <circle class="icon-node" cx="29" cy="29" r="3.2" />

    <!-- Center Hub Node -->
    <circle class="icon-node" cx="20" cy="20" r="4.2" />
    <circle class="icon-node-inner" cx="20" cy="20" r="1.8" />
  </g>

  <!-- Navy Blue Typography -->
  <text x="56" y="34">
    <tspan class="text-connect">Connect</tspan><tspan class="text-x">X</tspan>
  </text>
</svg>
