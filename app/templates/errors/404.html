{% extends "base.html" %}
{% block title %}404 Not Found - ConnectX{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 120px); display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem;">
  <div>
    <div style="font-size:4rem; color:var(--primary); font-weight:900;">404</div>
    <h1 style="font-size:1.5rem; font-weight:800; margin:0.5rem 0 1rem 0;">Page Not Found</h1>
    <p style="color:var(--text-muted); max-width:400px; margin:0 auto 1.5rem auto;">
      The channel, resource, or page you requested could not be located in ConnectX.
    </p>
    <a href="{{ url_for('chat.index') }}" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Return to Chat</a>
  </div>
</div>
{% endblock %}
